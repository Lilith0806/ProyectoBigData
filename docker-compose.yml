version: '3.8'

networks:
  lifemap-net:
    driver: bridge

volumes:
  mongo_data:
  jenkins_home:

services:
  mongodb:
    image: mongo:6.0
    container_name: lifemap_mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: lifemap_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - lifemap-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  spark-master:
    image: bitnami/spark:3.5
    container_name: lifemap_spark_master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - .:/workspace
    networks:
      - lifemap-net

  spark-worker:
    image: bitnami/spark:3.5
    container_name: lifemap_spark_worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    depends_on:
      - spark-master
    volumes:
      - .:/workspace
    networks:
      - lifemap-net

  dask-scheduler:
    image: ghcr.io/dask/dask:latest
    container_name: lifemap_dask_scheduler
    command: ["dask-scheduler"]
    ports:
      - "8786:8786"
      - "8787:8787"
    networks:
      - lifemap-net

  dask-worker-1:
    image: ghcr.io/dask/dask:latest
    container_name: lifemap_dask_worker_1
    command: ["dask-worker", "dask-scheduler:8786", "--nthreads", "2", "--memory-limit", "2GB"]
    depends_on:
      - dask-scheduler
    volumes:
      - .:/workspace
    networks:
      - lifemap-net

  dask-worker-2:
    image: ghcr.io/dask/dask:latest
    container_name: lifemap_dask_worker_2
    command: ["dask-worker", "dask-scheduler:8786", "--nthreads", "2", "--memory-limit", "2GB"]
    depends_on:
      - dask-scheduler
    volumes:
      - .:/workspace
    networks:
      - lifemap-net

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: lifemap_api
    restart: always
    environment:
      - MONGO_URI=mongodb://mongodb:27017/lifemap_db
      - SPARK_MASTER=spark://spark-master:7077
      - DASK_SCHEDULER=tcp://dask-scheduler:8786
      - PORT=5000
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - lifemap-net

  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: lifemap_jenkins
    user: root
    ports:
      - "8085:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - lifemap-net
